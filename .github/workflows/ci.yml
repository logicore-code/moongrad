name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: moon check + test + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check the toolchain version
        # The source uses `Int32` and `#derive(...)`, which arrived in
        # 0.1.20261104. The versioned downloads are not served, so
        # the toolchain cannot be pinned to that release; what can be
        # done is to refuse to build with one that is too old.
        run: |
          version=$(moon version | grep -oE '0\.1\.[0-9]+' | head -1)
          oldest=$(printf '%s\n' 0.1.20261104 "$version" | sort -V | head -1)
          if [ "$oldest" != "0.1.20261104" ]; then
            echo "::error::the toolchain is $version; the source needs 0.1.20261104 or newer"
            exit 1
          fi
          echo "the toolchain is $version"

      - name: Cache the MoonBit core library
        # Only the core library is cached. Caching the whole of
        # ~/.moon would restore the toolchain as well, and the
        # restore would then replace the one the install step
        # just put there.
        uses: actions/cache@v4
        with:
          path: ~/.moon/lib/core
          key: moon-core-${{ runner.os }}-${{ hashFiles('**/moon.mod') }}
          restore-keys: moon-core-${{ runner.os }}-

      - name: Format check
        run: moon fmt --check

      - name: Static type check
        run: moon check

      - name: Unit tests
        run: moon test

      - name: Smoke-test every example on the native target
        run: |
          for ex in \
            tensor_basics gradcheck reuse tensor_hessian \
            second_order minibatch nn_classifier linalg_demo \
            derivatives hessian checkpoint polyfit xor cse; do
            echo "--- examples/$ex"
            moon run "examples/$ex" --target native
          done

      - name: Benchmarks (release build)
        run: moon test --target native --release perf

      - name: Build every target
        # A type check does not link, so it would miss a target that
        # compiles and then fails to build.
        run: moon build --target all
