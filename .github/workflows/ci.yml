name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: moon check + test + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check the toolchain version
        # The project is accepted with moonc 1.0.0-rc1 or newer, and
        # the versioned downloads are not served, so the toolchain
        # cannot be pinned to a release. What can be done is to
        # refuse to build with a compiler that is too old, and to
        # write the version out.
        #
        # The check is the same script the README tells a reader to
        # run, so a reviewer gets the same answer as the build.
        id: toolchain
        run: |
          python3 scripts/check_toolchain.py --min 1.0.0-rc1
          version=$(python3 scripts/check_toolchain.py --min 1.0.0-rc1 | tail -1 | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the MoonBit core library
        # Only the core library is cached. Caching the whole of
        # ~/.moon would restore the toolchain as well, and the
        # restore would then replace the one the install step
        # just put there.
        #
        # The key carries the toolchain version, and the restore
        # prefix carries it too. The core library is not
        # interchangeable between releases: the compiler generates
        # code against the core it was built with, so a core from an
        # older release produces errors like "this function has no
        # parameter with label capacity~" in generated code that is
        # not the project's fault. A cache that outlives the
        # toolchain is worse than no cache.
        uses: actions/cache@v4
        with:
          path: ~/.moon/lib/core
          key: moon-core-${{ runner.os }}-${{ steps.toolchain.outputs.version }}
          restore-keys: moon-core-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-

      - name: Format check
        run: moon fmt --check

      - name: Static type check
        # A warning is a failure here. The README claims the library
        # checks clean, and a claim that nothing enforces is a claim
        # that decays; --deny-warn is what keeps it true.
        run: moon check --deny-warn

      - name: Unit tests
        run: moon test --deny-warn

      - name: Smoke-test every example on the native target
        # The examples are found rather than listed, so that an
        # example added later is run by this job without anyone
        # having to remember to add it here.
        run: |
          for dir in examples/*/; do
            ex="$(basename "$dir")"
            if [ "$ex" = "browser" ]; then
              continue
            fi
            echo "--- examples/$ex"
            moon run "examples/$ex" --target native
          done

      - name: Smoke-test the training examples on the release target
        # The other examples are small enough to run in a debug build.
        # These two train networks, and a debug build of the
        # convolution takes minutes rather than seconds, so they are
        # built in release. They are the same programs.
        run: |
          moon run examples/cnn --target native --release
          moon run examples/recipe --target native --release

      - name: Check that an outside project can import the library
        # A library is only useful if somebody else can use it. This
        # builds a throwaway module outside the repository, points it
        # at this one through a workspace manifest, and runs the
        # quick-start from the README verbatim -- so the instructions
        # in the README cannot go stale without the build noticing.
        run: |
          mkdir -p "$RUNNER_TEMP/embed/src"
          cd "$RUNNER_TEMP/embed"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/moon.mod" | head -1)
          cat > moon.mod <<MOD
          name = "embed-check"
          version = "0.1.0"

          import {
            "logicore-code/moongrad@$version",
          }
          MOD
          cat > moon.work <<WORK
          members = [
            ".",
            "$GITHUB_WORKSPACE",
          ]
          WORK
          cat > src/moon.pkg <<'PKG'
          import {
            "logicore-code/moongrad",
          }
          pkgtype(kind: "executable")
          PKG
          cat > src/main.mbt <<'MBI'
          fn main raise @moongrad.ADError {
            let g = @moongrad.TGraph::new()
            let b = @moongrad.TBinding::new()
            b.set_input(0, @moongrad.Tensor::vector([0.7, -1.3]))
            let x = g.slice(g.variable(0), 0, 0, 1)
            let y = g.slice(g.variable(0), 0, 1, 1)
            let f = g.add(g.mul(g.pow(x, 2.0), y), g.exp(x))
            let grads = @moongrad.t_grad(g, b, f)
            println(Repr(grads.input_grads[0].data))
          }
          MBI
          moon run src
          moon build --target wasm src

      - name: The browser example
        # The page in examples/browser runs the same module through the
        # same shim this script uses, so a build that works here works
        # in a tab. The module is compiled and run, not merely built.
        run: |
          moon build --target wasm examples/browser
          node examples/browser/run.mjs

      - name: Run an example on the wasm target
        # The wasm build is the reason this library is worth writing
        # in MoonBit: the whole engine, gradient compiler and all,
        # runs in a sandbox with no FFI and no runtime. Building it
        # proves it compiles; running it proves it computes.
        run: |
          echo "--- examples/reuse on wasm"
          moon run examples/reuse --target wasm
          echo "--- examples/gradcheck on wasm"
          moon run examples/gradcheck --target wasm

      - name: Benchmarks (release build)
        run: moon test --target native --release perf

      - name: Build every target
        # A type check does not link, so it would miss a target that
        # compiles and then fails to build.
        run: moon build --target all

  registry:
    name: the published module installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check the toolchain version
        run: python3 scripts/check_toolchain.py --min 1.0.0-rc1

      - name: Install the published module and run it
        # The acceptance requires the project to be published to
        # mooncakes.io, and the way to check that is to install it the
        # way anybody else would and run it. This job deliberately
        # does not have the repository on the module's search path: the
        # import has to resolve to the registry copy, not to the
        # checkout that is sitting next to it.
        #
        # The version comes out of moon.mod, so publishing a new one
        # without updating the manifest fails here rather than
        # silently checking the old release.
        run: |
          mkdir -p "$RUNNER_TEMP/from-registry/src"
          cd "$RUNNER_TEMP/from-registry"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/moon.mod" | head -1)
          cat > moon.mod <<MOD
          name = "registry-check"
          version = "0.1.0"

          import {
            "logicore-code/moongrad@$version",
          }
          MOD
          cat > src/moon.pkg <<'PKG'
          import {
            "logicore-code/moongrad",
          }
          pkgtype(kind: "executable")
          PKG
          cat > src/main.mbt <<'MBI'
          fn main raise @moongrad.ADError {
            let g = @moongrad.TGraph::new()
            let b = @moongrad.TBinding::new()
            b.set_input(0, @moongrad.Tensor::vector([0.7, -1.3]))
            let x = g.slice(g.variable(0), 0, 0, 1)
            let y = g.slice(g.variable(0), 0, 1, 1)
            let f = g.add(g.mul(g.pow(x, 2.0), y), g.exp(x))
            let grads = @moongrad.t_grad(g, b, f)
            println(Repr(grads.input_grads[0].data))
          }
          MBI
          moon update
          moon run src
          moon build --target wasm src
