name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: moon check + test + fmt
    runs-on: ubuntu-latest
    env:
      # The toolchain the source is written against and formatted
      # with. Pinning it keeps the build reproducible: the formatter
      # canonicalises a few spellings between releases, so a
      # different version would report a formatting difference that
      # has nothing to do with the code.
      MOON_VERSION: 0.1.20261104
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOON_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Cache the MoonBit core library
        uses: actions/cache@v4
        with:
          path: ~/.moon
          key: moon-core-${{ runner.os }}-${{ env.MOON_VERSION }}
          restore-keys: moon-core-${{ runner.os }}-

      - name: Format check
        run: moon fmt --check

      - name: Static type check
        run: moon check

      - name: Unit tests
        run: moon test

      - name: Smoke-test every example on the native target
        run: |
          for ex in \
            tensor_basics gradcheck reuse tensor_hessian \
            second_order minibatch nn_classifier linalg_demo \
            derivatives hessian checkpoint polyfit xor cse; do
            echo "--- examples/$ex"
            moon run "examples/$ex" --target native
          done

      - name: Benchmarks (release build)
        run: moon test --target native --release perf

      - name: Confirm every target compiles
        run: moon check --target all

      - name: Build the library for the preferred target
        run: moon build
